        completion_status: in_progress  # LEVER 1 DONE 2026-08-04 (revised after CI caught two bugs — see the FOUR-DESIGN note at the end of this comment), levers 2-5 still open. resetTestDb now (a) probes in ONE roundtrip for tables holding rows AND sequences with last_value IS NOT NULL, then (b) clears via DELETE with FK triggers suspended (sql.tx + SET LOCAL session_replication_role=replica) rather than TRUNCATE, then (c) ALTER SEQUENCE ... RESTART for every advanced sequence. MEASURED A/B on identical files: production-startup+rate-limiter 649.6s -> 35.6s wall (test time 630.4s -> 5.3s, 119x); packages/snapshots 45 files/751 tests 1945s -> 129s wall (test time 1851s -> 82s, 22x) — and that 1945s baseline was ALREADY the dirty-only-TRUNCATE version, so vs the original blanket sweep it is ~44x. Zero regressions (751/751, 62/62). THREE traps found by measuring, all handled + guarded by pg-test-reset.test.ts: (1) RESTART IDENTITY resets sequences even on EMPTY tables, so an insert-then-delete leaves rows=0 with last_value advanced — a row-only probe skips it and generated ids silently shift (proven: disabling the sequence branch fails with expected '4' to be '1'); (2) session_replication_role is per-CONNECTION and the data layer is pooled, so the DELETEs could land on a different connection with FK checks still live — sql.tx pins one connection and SET LOCAL reverts on COMMIT *or* ROLLBACK, guarded by a test asserting a real 23503 still fires after a reset; (3) non-superuser test roles cannot set that parameter, so it falls back to TRUNCATE on SQLSTATE 42501 ONLY — any other error surfaces instead of being masked. Escape hatch AXIS_TEST_RESET_FULL=1 restores the blanket sweep. LESSON: the fixture first used analytics_events, which apps/api/src/analytics.ts creates LAZILY — it does not exist in a snapshots-only run; a fixture guarding the reset must depend only on core pg-schema.ts tables (now uses code_symbols). NOTE: the escape-hatch test needs a 60s timeout because the OLD path is that slow under contention. FOUR DESIGNS, measured on packages/snapshots (45 files/752 tests) after CI failed the first attempt: (a) cached probe 129s but WRONG — a cached probe never learns about tables created LAZILY after the first reset (apps/api/src/analytics.ts does CREATE TABLE IF NOT EXISTS analytics_events on first use), so their rows leak between tests forever; (b) re-read the catalog every reset 230s — correct but the added latency pushed billing-edge-cases.test.ts's 200-row bulk-insert tests past their timeout; (c) one server-side DO block doing probe+clear+sequences 256s — correct, one roundtrip, but SLOWER because it re-plans 49 dynamic EXECUTE format(...) statements per reset where the static UNION ALL is planned once; (d) SHIPPED: cached static probe that also reports the current table count, rebuilt when the count changes (catches ADDS) or when the probe throws 42P01 undefined_table (catches DROPS) — 199s, 752/752. Correctness costs ~70s vs the buggy-fast (a), still ~29x better than the original blanket sweep. SEPARATE REAL PRODUCT BUG this exposed (not caused): billing-store.ts getRecentActivity ordered funnel_events by created_at DESC with NO tiebreaker, so two events written in the same millisecond had UNDEFINED order; it only ever passed because TRUNCATE handed each test a fresh heap whose physical order matched insertion order, and DELETE (which leaves dead tuples) broke the tie the other way. funnel_events.seq exists precisely as that tiebreaker — pg-schema.ts says so in a comment, and funnel-store.ts already uses `ORDER BY created_at DESC, seq DESC` in three places; this one query had drifted. Fixed to match. CI CONFIRMED GREEN 2026-08-04 (run 30934009293, all jobs success) — and CI's own build-and-test job dropped 10m46s -> 7m29s (~30%), so this is not only a local-dev win. CAVEAT ON THE NUMBERS: repeated runs of the same package on this Windows machine ranged 129-256s, so treat the order of magnitude (~29x) as solid and any precise multiple as noisy. LESSON WORTH KEEPING: fewer network roundtrips LOST to a warm query plan — the one-roundtrip server-side DO block was the slowest correct option because dynamic EXECUTE re-plans per statement. Measure; do not reason about which is faster. LEVER 2 DONE 2026-08-04: the four honesty guards each carried their OWN copy of the count extractors (visible/programClaims/generatorClaims/toolClaims/endpointClaims) over their OWN corpus, and two copies were materially weaker than count-honesty's. Now one shared apps/api/src/count-extractors.ts; the CORPORA stay separate per SPEC-12's deliberate scoping (only the extraction logic is shared). The real deliverable is apps/api/src/count-surface-coverage.test.ts, which closes the completeness hole no individual guard could: it walks the repo, finds every file making a global count claim, and fails unless that file is in some guard's corpus or in an UNGUARDED list WITH A REASON. Red-then-green proven (a new file claiming "999 artifacts across 42 programs" fails with an actionable message). WHAT IT FOUND IMMEDIATELY — four hand-maintained root packs guarded by NOTHING and stale since 2026-06-30: canvas-pack.md and remotion-pack.md "102 Artifacts" (real 147), superpowers-pack.md "102 Generators Across 18 Programs" (real 143/20) + "143 endpoints" (real 166), obsidian-vault-pack.md "75+ REST endpoints" (real 166) AND a stale "SQLite WAL, 5 tables" data-layer claim (real Neon Postgres, 49 tables). All corrected; canvas/remotion added to the launch corpus. OWNER DECISION OPEN: obsidian-vault-pack.md and superpowers-pack.md still assert "81/82 at Grade A" — the unverifiable capability_inventory self-audit SPEC-12 already stripped from the launch corpus. Deleting it from marketing prose is a content call, so both are exempted with that reason recorded rather than silently rewritten; resolve the claim, then move them into corpus() and drop the exemptions. HONEST SCOPE NOTE: lever 2 barely dents the 7855 test COUNT 