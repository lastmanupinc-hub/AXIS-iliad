          it is packages/snapshots/src/pg-test.ts's resetTestDb(), which issues a SEPARATE
          `TRUNCATE ... RESTART IDENTITY CASCADE` per table, in a loop, across all 49 tables, on
          EVERY test's beforeEach. Benchmarked head-to-head against the real test Postgres:
          per-table loop 7825ms | single multi-table TRUNCATE 2348ms | probe-then-truncate-only-dirty
          153ms for 3 dirty tables (65ms for 1, 7.5ms when nothing is dirty). Realistic win 51-121x;
          projected ~2000 DB-backed tests: 261 min -> ~5 min.
          LEVERS, revised into ROI order after measurement:
          (1) dirty-only reset in pg-test.ts — one function, biggest payoff;
          (2) consolidate the redundant invariant tests — the real COUNT reduction: the 142->143 bump
              this session was enforced by FIVE separate files (count-honesty, counts-consistency x2,
