          (b) CORRECTNESS: `RESTART IDENTITY` resets sequences even on EMPTY tables, and pg-test.ts's
              docstring promises deterministic per-test IDENTITY values. A test that inserts then
              deletes leaves the table empty but the sequence ADVANCED — dirty-only would skip it and
              silently break ID-asserting tests intermittently. The probe must cover sequences, not
