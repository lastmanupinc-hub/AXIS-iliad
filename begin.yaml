              genuine count reduction but they are FAST, so maintainability only, and collapsing them
              risks the 60/60/50/60 coverage thresholds. Lowest priority.
          TWO TRAPS FOUND WHILE MEASURING, both must be handled by (1):
          (a) TRUNCATE cost is NON-LINEAR — 3 tables 145ms but 5 tables 1670ms (11x jump for 2 more),
