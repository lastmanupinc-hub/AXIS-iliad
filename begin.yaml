        severity: MEDIUM
        source_file: "packages/snapshots/src/pg-test-reset.test.ts"
        completion_status: complete  # FIXED 2026-08-16. THE DIAGNOSIS ABOVE WAS WRONG, and measuring is what showed it: I filed this as
        # "contention" because every observation happened under load. It is not contention. Benchmarked the escape-hatch sweep against the
        # real test Postgres with ZERO other connections (verified via pg_stat_activity — nothing else attached, no orphans), n=7, 47 tables:
        # the shipped per-table DO loop cost min 22.7s / MED 30.8s / max 43.4s. On an IDLE machine. Against a 60s budget. It was consuming
        # half its own ceiling before any load existed, so anything slower — the Docker gate's I/O, coverage instrumentation — pushed it over.
        # Same shape vitest.config.ts's testTimeout comment already describes: "not failing at random; guaranteed to fail the moment anything
        # got slightly slower." ROOT CAUSE: the sweep issued one `TRUNCATE ... RESTART IDENTITY CASCADE` PER TABLE, so cost scaled with table
        # count (each pays its own ACCESS EXCLUSIVE lock, relfilenode swap and fsync) rather than with the near-zero row count. The galling
