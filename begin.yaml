e the OLD path is that slow under contention. FOUR DESIGNS, measured on packages/snapshots (45 files/752 tests) after CI failed the first attempt: (a) cached probe 129s but WRONG — a cached probe never learns about tables created LAZILY after the first reset (apps/api/src/analytics.ts does CREATE TABLE IF NOT EXISTS analytics_events on first use), so their rows leak between tests forever; (b) re-read the catalog every reset 230s — correct but the added latency pushed billing-edge-cases.test.ts's 200-row bulk-insert tests past their timeout; (c) one server-side DO block doing probe+clear+sequences 256s — correct, one roundtrip, but SLOWER because it re-plans 49 dynamic EXECUTE format(...) statements per reset where the static UNION ALL is planned once; (d) SHIPPED: cached static probe that also reports the current table count, rebuilt when the count changes (catches ADDS) or when the probe throws 42P01 undefined_table (catches DROPS) — 199s, 752/752. Correctness costs ~70s vs the buggy-fast (a), still ~29x better than the original blanket sweep. SEPARATE REAL PRODUCT BUG this exposed (not caused): billing-store.ts getRecentActivity ordered funnel_events by created_at DESC with NO tiebreaker, so two events written in the same millisecond had UNDEFINED order; it only ever passed because TRUNCATE handed each test a fresh heap whose physical order matched insertion order, and DELETE (which leaves dead tuples) broke the tie the other way. funnel_events.seq exists precisely as that tiebreaker — pg-schema.ts says so in a comment, and funnel-store.ts already uses `ORDER BY created_at DESC, seq DESC` in three places; this one query had drifted. Fixed to match. CI CONFIRMED GREEN 2026-08-04 (run 30934009293, all jobs success) — and CI's own build-and-test job dropped 10m46s -> 7m29s (~30%), so this is not only a local-dev win. CAVEAT ON THE NUMBERS: repeated runs of the same package on this Windows machine ranged 129-256s, so treat the order of magnitude (~29x) as solid and an