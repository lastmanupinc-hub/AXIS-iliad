    title: "Delta intelligence: pure buildDeltaReport + export-surface wiring"
    phase: now
    status: open
    depends_on: []
    spec: docs/agentic-asset/specs/SPEC-01-delta.md
    branch: feat/aa-delta-report
    files_expected:
      - packages/generator-core/src/delta-report.ts          # new
      - packages/generator-core/src/delta-report.test.ts     # new
      - packages/generator-core/src/index.ts                 # export line only
      - apps/api/src/export.ts                               # fetch prev ctx + append
    acceptance:
      - pnpm --filter @axis/generator-core build
      - "vitest run packages/generator-core/src/delta-report.test.ts --no-coverage   # all pass"
      - "vitest run packages/generator-core/src/determinism.test.ts packages/generator-core/src/generate.test.ts --no-coverage   # unchanged, all pass"
      - "DATABASE_URL=postgres://postgres:postgres@localhost:5433/axis_test vitest run apps/api/src/export.test.ts --no-coverage   # all pass"
      - pnpm --filter @axis/api exec tsc --noEmit
