        `if (owner)` branch and is out of scope at the delta call site; wiring it
        in would require restructuring the handler. No FunnelEventType/FunnelStage
        values were added (those live outside files_expected, in
        packages/snapshots/src/funnel-types.ts).
      - Diff is 526 changed lines vs the spec's "~250 LOC total" estimate (~2.1x),
        driven entirely by faithfully implementing the spec's own 7 keyed
        comparison sections (stack/routes/domain models/hotspots/warnings/entry
        points/size) plus the tests-first mandate — not scope creep or anything
        outside files_expected. Flagged per §5 ("if the spec forces more, say so
        in the PR body") rather than treated as a §6.5 STOP, since no forbidden
        zone, new dependency, secret, or architectural drift was involved.

