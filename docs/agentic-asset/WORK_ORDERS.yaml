      - `export.test.ts` — 19/19 pass (17 pre-existing + 2 new: two-snapshot project's
        export contains delta-report.md with the diffed content; single-snapshot
        project's export omits it).
      - `pnpm --filter @axis/api exec tsc --noEmit` — clean, no errors.
      - Also ran repo-wide gates (constitution §4, not in this WO's list):
        count-honesty.test.ts + strategic-docs-honesty.test.ts — 7/7 pass.
      Notes for the owner:
      - Branched from `docs/agentic-asset-strategy` (main's tip c9fb61f + the 2
        docs-only governance commits), NOT bare `main` — WORK_ORDERS.yaml/
        CONSTITUTION.md/specs don't exist on main yet, so branching from main per
        §1.3 would have made it impossible to update this file in the same PR per
        this queue's own header instruction. No divergent code between the two,
        only the governance docs I was asked to read. PR is opened against
        `docs/agentic-asset-strategy`, not `main`.
      - trackEvent("delta_generated", "product", ...) from the spec's "Surface
        wiring" section was SKIPPED per the spec's own fallback clause ("if auth
