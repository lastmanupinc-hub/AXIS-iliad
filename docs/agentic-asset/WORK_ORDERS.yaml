      - "vitest run packages/generator-core/src/delta-report.test.ts --no-coverage   # all pass"
      - "vitest run packages/generator-core/src/determinism.test.ts packages/generator-core/src/generate.test.ts --no-coverage   # unchanged, all pass"
      - "DATABASE_URL=postgres://postgres:postgres@localhost:5433/axis_test vitest run apps/api/src/export.test.ts --no-coverage   # all pass"
      - pnpm --filter @axis/api exec tsc --noEmit
    evidence: |
      Files touched match files_expected exactly (no other files edited).
      - `pnpm --filter @axis/generator-core build` — clean, no errors.
      - `delta-report.test.ts` — 11/11 pass (identical ctx → null; added framework +
        removed route + resolved warning render in correct sections with correct
        counts; field_count "12 → 15 fields"; hotspots entered/left; entry points
        added/removed; size total + per-language deltas; >15 routes truncate with
        "… +3 more"; determinism — same inputs twice byte-identical; appendDeltaReport
        idempotent + no-op on null + no-op on empty package).
      - `determinism.test.ts` + `generate.test.ts` — unchanged, 123/123 pass.
      - `export.test.ts` — 19/19 pass (17 pre-existing + 2 new: two-snapshot project's
        export contains delta-report.md with the diffed content; single-snapshot
        project's export omits it).
      - `pnpm --filter @axis/api exec tsc --noEmit` — clean, no errors.
      - Also ran repo-wide gates (constitution §4, not in this WO's list):
        count-honesty.test.ts + strategic-docs-honesty.test.ts — 7/7 pass.
      Notes for the owner:
      - Branched from `docs/agentic-asset-strategy` (main's tip c9fb61f + the 2
        docs-only governance commits), NOT bare `main` — WORK_ORDERS.yaml/
        CONSTITUTION.md/specs don't exist on main yet, so branching from main per
        §1.3 would have made it impossible to update this file in the same PR per
        this queue's own header instruction. No divergent code between the two,
        only the governance docs I was asked to read. PR is opened against
        `docs/agentic-asset-strategy`, not `main`.
      - trackEvent("delta_generated", "product", ...) from the spec's "Surface
        wiring" section was SKIPPED per the spec's own fallback clause ("if auth
        context is not available there, skip tracking rather than restructuring"):
        in handleExportZip, `auth`/`account` is only resolved inside the
        `if (owner)` branch and is out of scope at the delta call site; wiring it
        in would require restructuring the handler. No FunnelEventType/FunnelStage
        values were added (those live outside files_expected, in
        packages/snapshots/src/funnel-types.ts).
      - Diff is 526 changed lines vs the spec's "~250 LOC total" estimate (~2.1x),
        driven entirely by faithfully implementing the spec's own 7 keyed
        comparison sections (stack/routes/domain models/hotspots/warnings/entry
        points/size) plus the tests-first mandate — not scope creep or anything
        outside files_expected. Flagged per §5 ("if the spec forces more, say so
        in the PR body") rather than treated as a §6.5 STOP, since no forbidden
        zone, new dependency, secret, or architectural drift was involved.

  - id: WO-02
    title: "Economic activation: wire meterPersistenceOp at the version REST surface"
    phase: now
    status: done
    depends_on: []
    spec: docs/agentic-asset/specs/SPEC-02-persistence-metering.md
    branch: feat/aa-persistence-metering
    files_expected:
      - apps/api/src/versions.ts
      - apps/api/src/versions.test.ts            # new or extended
      - apps/api/src/openapi.ts                  # only if response schema documented there
    acceptance:
      - "DATABASE_URL=postgres://postgres:postgres@localhost:5433/axis_test vitest run apps/api/src/versions.test.ts --no-coverage"
      - "DATABASE_URL=postgres://postgres:postgres@localhost:5433/axis_test vitest run apps/api/src/count-honesty.test.ts apps/api/src/openapi.test.ts --no-coverage"
      - pnpm --filter @axis/api exec tsc --noEmit
    evidence: |
      Files touched match files_expected exactly (versions.ts, versions.test.ts,
      openapi.ts — the last one only to add a 402 response entry, no new schema/route).
      Diff: 70 changed lines vs the spec's "~120 LOC" estimate — under, no ballooning.
      - `versions.test.ts` — 22/22 pass (existing 14 unchanged + 8 new: anonymous diff
        stays 200/unmetered — pre-existing test, verified still green; free-tier
        authenticated → 402 persistence_credits_required with "paid plan" reason;
        paid+credits → 200 AND ledger shows a diff_versions debit of
        PERSISTENCE_CREDIT_COSTS.diff_versions tied to the snapshot_id; paid+zero
        credits → 402; list/get stay 200 and untouched-ledger for the same free
        account).
      - `count-honesty.test.ts` + `openapi.test.ts` — 38/38 pass (incl. the route-spec
        parity tripwire — no new routes were added, only a 402 response entry on the
        existing diff route, so nothing to newly register).
      - `pnpm --filter @axis/api exec tsc --noEmit` — clean, no errors.
      Findings for the owner (both pre-authorized forks per the spec's own guidance,
      §6 STOP does not apply):
      - **Version-write path has no production caller at all.** Grepped
        `saveGenerationVersion(` across apps/api/src: the only call sites are test
        setup code (versions.test.ts, e2e-flows.test.ts) — there is no REST handler
        or generation-flow code path that calls it in production today. The spec's
        fork ("if the write happens implicitly inside generation, DO NOT meter it")
        applies a fortiori since there's no write path to meter at all yet. Metered
        only `diff_versions`, as the spec's fallback directs.
      - **Anonymous-caller branch confirmed.** `assertSnapshotAccess` (handlers.ts)
        returns `true` immediately for snapshots with `account_id: null` *without*
        ever calling `resolveAuth` — i.e. the handler currently allows fully
        anonymous reads/diffs on ownerless snapshots. Per the spec's explicit fork,
        metering applies only when the caller resolves to a real account (any
        tier, including free — free-tier authenticated callers ARE metered and
        correctly blocked, matching test case 1); a caller with no auth at all
        is left on the pre-existing unmetered path. No public behavior changed
        beyond the new 402 contract.
      - **trackEvent("persistence_metered", "revenue", ...) SKIPPED**, same class of
        gap as WO-01: neither `"persistence_metered"` (FunnelEventType) nor
        `"revenue"` (FunnelStage) exist in `packages/snapshots/src/funnel-types.ts`
        today, and that file is outside this WO's `files_expected`. Calling
        `trackEvent` with those literals would fail `tsc --noEmit` (and casting
        through `as unknown as FunnelEventType` would be exactly the kind of
        strict-mode bypass the constitution forbids). Skipped per the same
        precedent set in WO-01; flagging here rather than re-asking, since it's a
        smaller, more mechanical gap (two missing union members, not an
        architectural scoping issue) and the user has already endorsed
        disclose-and-proceed for this class of judgment call. If the owner wants
        this analytics event, it needs a follow-up micro-task that adds
        `"persistence_metered"`/`"revenue"` to funnel-types.ts (outside any current
        WO's files_expected).

