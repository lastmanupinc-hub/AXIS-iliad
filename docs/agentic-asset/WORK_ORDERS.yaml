# Agentic-Asset program — work-order queue (the program's memory).
# Executor: take the FIRST status:open whose depends_on are all done.
# After finishing: set status, fill evidence, commit this file in the same PR.
# Schema: id, title, phase, status(open|blocked|done), depends_on, spec, branch,
#         files_expected (the ONLY files you may create/edit), acceptance
#         (commands that must all pass), evidence (executor fills).

