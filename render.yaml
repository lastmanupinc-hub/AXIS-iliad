# ─── Axis' Iliad — Render Blueprint ─────────────────────────────
#
# Deploy:  Connect this repo on Render → auto-detects render.yaml
# Docs:    https://docs.render.com/blueprint-spec

services:
  - type: web
    name: axis-api
    # Build the API from this repo's Dockerfile (the "toolbox" Blueprint is
    # connected to AXIS-iliad). This replaces the GHCR image-pull so shipping the
    # API no longer depends on GitHub Actions building + pushing an image — Render
    # builds on push. Blueprint autoSync applies this flip to the axis-api service.
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /v1/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      # 32+ char secret used to AES-256-GCM encrypt stored GitHub tokens.
      # The API fails closed (refuses to encrypt) in production if unset — and
      # for a long while it WAS unset, which is what broke GitHub login on
      # 2026-07-26 (the throw landed after the account already existed and got
      # swallowed into a generic error redirect). Set 2026-07-27.
      - key: AXIS_TOKEN_KEY
        sync: false
      # Gates all 5 admin endpoints; requireAdmin 403s when unset. Declared
      # here purely so the Blueprint knows the key EXISTS — the value stays
      # dashboard-only (sync: false). It was set on the service but absent
      # from this file, which is the same orphaning shape that left
      # RESEND_FROM_ADDRESS one Blueprint sync away from silently killing all
      # email. Declaring it is the cheap half of that lesson.
      - key: ADMIN_API_KEY
        sync: false
      # Deny-by-default: self-serve tier upgrades / credit minting are
      # disabled in production — upgrades must go through POST /v1/checkout.
      - key: AXIS_ALLOW_SELF_SERVE_ENTITLEMENTS
        value: "false"
      # H1: collect payment in-band on the MCP tool-call surface (turn the 402 an
      # over-quota agent hits into a completed purchase via X-Payment retry).
      # Degrades gracefully to the existing 402-negotiation error if the payment
      # rail (STRIPE_SECRET_KEY / MPP) is not configured.
      - key: AXIS_MCP_INBAND_SETTLEMENT
        value: "true"
      # PostgreSQL (Neon). Set the connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        value: https://iliad.trustfabric.ai
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      # Google OAuth web login (mirrors GitHub). Client id/secret are secrets set
      # in the dashboard; the callback URL is fixed and MUST byte-match the
      # Authorized redirect URI registered in Google Cloud Console, or the token
      # exchange fails with redirect_uri_mismatch.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://api.iliad.trustfabric.ai/v1/auth/google/callback
      # MCP OAuth2 authorization-server signing keys (RS256 PEM strings, oauth-server.ts).
      # Without these, the process falls back to an ephemeral in-memory keypair and every
      # issued MCP OAuth token stops verifying on the next restart/deploy (R0.2).
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: AXIS_WEB_URL
        value: https://iliad.trustfabric.ai
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: MPP_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # ─── Tempo/USDC token rail (x402) ──────────────────────────
      # The owner's own receiving wallet address (0x…) for on-chain USDC
      # settlement. Dashboard-set on purpose — a payment address committed to
      # the repo is a tamper target (a malicious PR could redirect revenue).
      # While unset, the 402 envelope serves the Stripe-only fallback and the
      # token rail is OFF (verified live 2026-07-14). Setting this value is
      # what turns on token-first payments in production.
      # TEMPO_TESTNET is intentionally NOT declared — absent means mainnet
      # USDC; only ever set it (value "true") on a non-production service.
      - key: TEMPO_RECIPIENT_ADDRESS
        sync: false
      # ─── PAI'D Payment Processor (axis-pai-paid-api) ──────
      # Custom domain api.trustfabric.ai is a CNAME onto the same Render
      # service as axis-pai-paid-api-main.onrender.com (verified: identical
      # /health + root manifest, service "axis-pai-paid-api"). Using the
      # custom domain so this survives a Render service rename/migration.
      - key: PAID_API_BASE_URL
        value: https://api.trustfabric.ai/v1
      - key: PAID_MERCHANT_ID
        value: acct_7ec95648-c529-4ee2-9ab4-3fd22953ac1c
      - key: PAID_PLAN_PRO_MONTHLY
        value: plan_299dde3d-4db4-4f56-b572-a60c7c1d5f50
      - key: PAID_PLAN_PRO_ANNUAL
        value: plan_4cbd5d23-bd77-4421-99b5-4e6ef43b530f
      - key: PAID_API_KEY
        sync: false
      - key: PAID_WEBHOOK_SIGNING_KEY
        sync: false
      # NOTE: PAI'D uses hosted checkout (it hosts the payment page and returns
      # a redirect URL), so NO Stripe publishable key is needed here, and
      # PAID_API_SECRET is unused under bearer auth — both intentionally dropped.
      # PAID_PLAN_PRO_* above are legacy subscription plan IDs; the hosted-
      # checkout path prices server-side from PLAN_CATALOG and does not use them.
      # Future Growth-tier plan IDs — map to the "suite" tier in the
      # PAI'D webhook. Uncomment and fill in once the Growth plans are
      # created on the PAI'D side:
      # - key: PAID_PLAN_GROWTH_MONTHLY
      #   value: plan_xxxxxxxx
      # - key: PAID_PLAN_GROWTH_ANNUAL
      #   value: plan_xxxxxxxx
      # ─── Proxied Tool Integrations (Phase 1+) ─────────────────
      - key: FIRECRAWL_API_KEY
        sync: false
      # ⚠ DECLARED BUT NEVER READ (Phase T finding, 2026-07-27). Neither key has
      # any consuming code path in apps/api/src — REPLICATE_API_TOKEN appears
      # only in env.ts's spec and inside generator TEMPLATE strings (detection
      # lists describing OTHER people's repos, not calls this service makes),
      # and FASTIO_API_KEY appears in exactly one place, the env spec. They are
      # kept here rather than deleted because removing provisioned production
      # credentials is an owner decision (tracked as P8 in
      # docs/CONFIDENCE_REPORT.md), not a cleanup call to make unilaterally.
      # If neither integration is planned, drop both keys AND clear the values
      # in the Render dashboard — an unread secret is attack surface, not
      # optionality.
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FASTIO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Verified Resend sender. Both this AND RESEND_API_KEY must be present or
      # readEmailConfigFromEnv() returns null and every send path degrades —
      # feedback tickets 503, iliad_transactional_email reports _not_configured.
      # It was previously set by hand in the dashboard only, which the Blueprint
      # would not preserve; pinning it here makes email delivery durable.
      - key: RESEND_FROM_ADDRESS
        value: axis@trustfabric.ai
      # Where customer feedback / support tickets are delivered (POST /v1/feedback).
      # Matches the address already published across the Help, Plans, Q&A, Terms
      # and Usage pages, so customers never see two different support addresses.
      - key: SUPPORT_EMAIL
        value: support@jonathanarvay.com
    disk:
      name: axis-data
      mountPath: /data
      sizeGB: 1
