  - id: determinism_test_count
    text: "3 byte-identical determinism tests"
    value: 3
    source: "packages/generator-core/src/determinism.test.ts (count of `it(...)` blocks)"
    status: verified
    verified_at: "2026-07-02"

  - id: test_file_count
    text: "205 test files"
    value: 205
    source: "find apps packages -name '*.test.ts' (excluding node_modules/dist)"
