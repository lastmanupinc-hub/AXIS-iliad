# LAUNCH_CLAIMS.yaml — the single registry of publishable launch claims.
# A claim may appear in launch copy ONLY if it is here with status: verified.
# apps/api/src/launch-claims.test.ts enforces the counts-backed entries against
# the live constants (apps/api/src/counts.ts, PLAN_CATALOG) and scans the launch
# corpus (launch-content.md, marketing-pack.md, AXIS_Board_Pitch.md) for stale
# or forbidden claims. Entries with status needs_regeneration_before_publish
# carry the regeneration command and MUST be re-run (and verified_at bumped)
# before any publish — the pinned value here is a snapshot, not a live constant.
#
# Verified 2026-07-02 against main HEAD (commit a2f92ac).

claims:
  - id: artifact_count
    text: "141 artifacts per analysis"
    value: 141
    source: "apps/api/src/counts.ts ARTIFACT_COUNT (derived from the generator REGISTRY)"
    status: verified
    verified_at: "2026-07-02"

  - id: program_count
    text: "20 specialized programs"
    value: 20
    source: "apps/api/src/counts.ts PROGRAM_COUNT"
    status: verified
    verified_at: "2026-07-02"

  - id: endpoint_count
    text: "148 REST endpoints"
    value: 148
    source: "apps/api/src/counts.ts ENDPOINT_COUNT (guarded by counts-consistency.test.ts)"
    status: verified
    verified_at: "2026-07-02"

  - id: mcp_tool_count
    text: "29 MCP tools"
    value: 29
    source: "apps/api/src/counts.ts MCP_TOOL_COUNT"
