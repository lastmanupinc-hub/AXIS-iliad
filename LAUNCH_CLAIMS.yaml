    verified_at: "2026-07-02"

  - id: api_version
    text: "v0.5.3"
    value: "0.5.3"
    source: "apps/api/src/counts.ts API_VERSION (kept in lockstep with apps/api/package.json)"
    status: verified
    verified_at: "2026-07-02"

  - id: test_count
    text: "4,900+ automated tests"
    value: "regenerate"
    source: "npx vitest run --reporter=dot 2>&1 | tail -5 — refresh + bump verified_at before publish. Snapshot value shares a source with README.md's badge (both regenerated together)."
    status: needs_regeneration_before_publish

  - id: coverage
    text: "91.5% coverage"
    value: "regenerate"
    source: "vitest --coverage summary — refresh + bump verified_at before publish. Snapshot value shares a source with README.md's badge."
