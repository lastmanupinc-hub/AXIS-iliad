# ─────────────────────────────────────────────────────────────────────────────
# Iliad Agentic Platform Strategy
# Purpose: Define the product + engineering roadmap for turning Iliad into
#          a full-stack agent operating system via the MCP hub model.
# Owner:   Jonathan Arvay
# Date:    2026-05-21
# ─────────────────────────────────────────────────────────────────────────────

strategy:
  name: "Iliad Agent OS"
  tagline: "One MCP connection. Every tool an agent needs."
  core_thesis: >
    Iliad's moat is not any single tool — it's the bundled experience: codebase
    intelligence + payment rail + proxied high-value tools over a single
    authenticated MCP endpoint. Agents pay a premium for reduced cognitive load,
    single billing, and higher workflow reliability. Proxy non-core tools
    aggressively; own the analysis + x402 layer exclusively.

# ─────────────────────────────────────────────────────────────────────────────
# FINANCIAL MODEL
# ─────────────────────────────────────────────────────────────────────────────

financial_model:
  principle: >
    Agentic purchasing is value-per-dollar ruthless. Iliad wins by delivering
    orchestration value ABOVE what agents can get by calling providers directly.
    Markup is justified by: single connection, single auth, single billing,
    smart chaining, caching, retries, and codebase-aware context enrichment.

  proxy_vs_build:
    build_own_tool:
      upfront_cost_usd: "15000–60000 opportunity cost"
      time_to_parity: "2–6 months"
      ongoing_infra_monthly: "500–2000 (crawler) + 50–200 (email infra)"
      risk: high
      recommendation: "Never for commodity tools. Only for your core differentiator."
    proxy_third_party:
      upfront_cost_usd: "~0 (1–2 weeks integration time)"
      time_to_market: "1–2 weeks"
      ongoing_infra_monthly: "wholesale API cost only"
      risk: low
      recommendation: "Default choice for all non-core tools."

  markup_model:
    target_margin: "30–100% over wholesale cost"
    examples:
      - tool: firecrawl_page_scrape
        wholesale_per_1k_pages_usd: 0.80
        iliad_price_per_1k_pages_usd: 1.60
        margin_pct: 100
      - tool: replicate_image_gen
        wholesale_per_run_usd: 0.0023
        iliad_price_per_run_usd: 0.004
        margin_pct: 74
      - tool: resend_email
        wholesale_per_1k_emails_usd: 0.90
        iliad_price_per_1k_emails_usd: 1.50
        margin_pct: 67
    note: >
      Agents are willing to pay 1.5–2.5x for the bundled experience.
      The key differentiator is not being cheaper — it is being more valuable.

  pricing_model: subscription_plus_overage
  pricing_rationale: >
    Subscription tiers give human operators (developers configuring agents) a
    predictable monthly budget. Blended credits abstract away per-tool pricing
    so agents never need to track 8 different cost units. Overages charged at
    a flat per-credit rate via Stripe so no call ever hard-fails — it just
    bills. x402 autonomous payment rail remains the mechanism for agents
    calling without a session; it deducts from the account's credit balance
    rather than initiating a new charge each call. Annual billing saves 20%.

  credit_system:
    unit: "1 Iliad Credit"
    unit_value_note: "Same value regardless of which tool consumes it. Agents see one number."
    overage_rate_per_credit_usd: 0.0018
    annual_discount_pct: 20
    credit_costs:
      - action: "Full codebase analysis (standard)"
        credits: 2500
        notes: "Includes 102 artifacts — AGENTS.md, .cursorrules, debug playbook, etc."
      - action: "Deep codebase analysis (large repo)"
        credits_range: "6000–12000"
        notes: "Auto-detected based on file count and complexity"
      - action: "Firecrawl scrape (per page)"
        credits: 1.5
        notes: "Markdown + structured data output"
      - action: "Firecrawl search + scrape"
        credits: 4
        notes: "Research workflow — query + fetch"
      - action: "Replicate image gen (Flux / standard)"
        credits: 12
      - action: "Replicate high-quality / video"
        credits_range: "35–80"
        notes: "Advanced models — charged at actual model cost"
      - action: "Fastio store / retrieve / RAG query"
        credits: 1
        notes: "Per operation"
      - action: "Resend email"
        credits: 2
        notes: "Per email sent"

  pricing_tiers:
