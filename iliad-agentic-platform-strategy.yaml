      monthly_credits: 10000
      monthly_price_usd: 0
      codebase_analysis_runs: 3
      firecrawl_pages: 1000
      replicate_images: 20
      fastio_storage_gb: 5
      resend_emails: 500
      mcp_access: true
      x402_autonomous: limited
      usage_dashboard: basic
      support: community
      best_for: "Testing agents, exploring tools"

    starter:
      monthly_credits: 75000
