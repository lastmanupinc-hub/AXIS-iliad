# ─────────────────────────────────────────────────────────────────────────────
# ARCHITECTURE
# ─────────────────────────────────────────────────────────────────────────────

architecture:
  model: "MCP Hub / Aggregator"
  single_endpoint: "https://axis-api-6c7z.onrender.com/mcp"
  auth: "Bearer <AXIS_API_KEY> — single credential unlocks all tools"

  additive_principle: >
    Proxied tools are net-new additions. They do not change, replace, or
    compete with the existing codebase analysis tools (analyze_repo,
    analyze_files, prepare_agentic_purchasing, improve_my_agent_with_axis).
    They extend the platform so agents that arrive for code analysis can
    accomplish related work (research, image gen, storage, email) without
    leaving the Iliad MCP connection. All existing tool schemas, x402 gates,
    quota headers, and test suites remain unchanged.

  tool_registry:
    owned_tools:
      - name: analyze_repo
        description: "Deep codebase analysis → 99 artifacts"
        pricing: x402_50_cents
        differentiator: true
      - name: analyze_files
        description: "Inline file analysis"
        pricing: x402_50_cents
        differentiator: true
      - name: prepare_agentic_purchasing
        description: "AP2/Visa/CE3.0 purchasing readiness audit"
        pricing: x402_50_cents
        differentiator: true
      - name: improve_my_agent_with_axis
        description: "Agent self-improvement loop"
        pricing: x402_50_cents
        differentiator: true

    proxied_tools:
      - name: iliad_web_research
        backed_by: firecrawl
        mcp_upstream: "https://mcp.firecrawl.dev/v2/mcp"
        env_key: FIRECRAWL_API_KEY
        value_add: >
          Codebase-aware scraping: when called during analyze_repo, Iliad
          auto-enriches queries with repo context (tech stack, domain, frameworks)
          for higher relevance than raw Firecrawl calls.
        pricing:
          per_page_usd: 0.0016
          markup_over_wholesale: "100%"
        priority: 1

      - name: iliad_image_gen
        backed_by: replicate
        mcp_upstream: "https://mcp.replicate.com"
        env_key: REPLICATE_API_TOKEN
        value_add: "UI mock generation from context_map; Mars/game asset generation."
        pricing:
          per_run_usd: 0.004
          markup_over_wholesale: "74%"
        priority: 2

      - name: iliad_storage
        backed_by: fastio
        mcp_upstream: "https://mcp.fast.io/mcp"
        env_key: FASTIO_API_KEY
        value_add: >
          Persistent agent memory. Snapshot artifacts auto-saved; long-running
          sessions maintain state across context windows.
        pricing:
          per_gb_usd: 0.05
          markup_over_wholesale: "50%"
        priority: 2

      - name: iliad_email
        backed_by: resend
        rest_api: "https://api.resend.com/emails"
        env_key: RESEND_API_KEY
        value_add: >
          Agents can send analysis reports, audit results, and alerts.
          Iliad templates the email body from snapshot artifacts automatically.
        pricing:
          per_1k_emails_usd: 1.50
          markup_over_wholesale: "67%"
        priority: 3

      - name: iliad_payments_enhanced
        backed_by: neverminded
        description: "Supplementary payment layer — credit burning + paywall"
        value_add: "Complements existing x402 rail with subscription-style credit burning."
        priority: 4

      - name: iliad_db
        backed_by: upstash_or_postgres_mcp
        description: "Safe SQL agent memory layer with Iliad auth"
        value_add: "Persistent project state across agent sessions."
        priority: 4

  value_chain:
    example_workflow: "Mars Tech Research Agent"
    steps:
      - step: 1
        tool: search_and_discover_tools
        action: "Find relevant programs for tech research + code analysis"
        cost: free
      - step: 2
        tool: iliad_web_research
        action: "Scrape recent Mars colony engineering papers, NASA docs"
        cost: "$0.016 (10 pages)"
      - step: 3
        tool: analyze_repo
        action: "Analyze SpaceX/starship-software GitHub repo"
        cost: "$0.50"
      - step: 4
        tool: iliad_image_gen
        action: "Generate Mars base UI concept from brand guidelines artifact"
        cost: "$0.004"
      - step: 5
        tool: iliad_email
        action: "Send compiled report to team"
        cost: "$0.0015"
      - step: 6
        tool: iliad_storage
        action: "Persist snapshot + artifacts for follow-up sessions"
        cost: "$0.001"
    total_agent_cost: "~$0.52 for a full research + analysis + delivery pipeline"
    iliad_revenue: "~$0.25 gross profit (net of wholesale)"

# ─────────────────────────────────────────────────────────────────────────────
# COMPETITIVE DIFFERENTIATION
# ─────────────────────────────────────────────────────────────────────────────

differentiation:
  headline: "Why agents pay Iliad more than direct tool providers"
  dimensions:
    - dimension: single_connection
      direct_competitor: "Need separate MCP/credentials per tool"
      iliad: "One /mcp endpoint, one API key, one billing relationship"
      agent_value: "Huge — agents can't manage 6+ credentials reliably"

    - dimension: single_billing
      direct_competitor: "Multiple invoices, separate auth flows"
      iliad: "One Stripe checkout via x402 rail; autonomous payment supported"
      agent_value: "Critical for fully-autonomous agent workflows"

    - dimension: codebase_aware_context
      direct_competitor: "Generic tool outputs (raw markdown, raw image)"
      iliad: "Outputs enriched with repo context from analyze_repo artifacts"
      agent_value: "Higher relevance = fewer retries = lower total cost"

    - dimension: orchestration
      direct_competitor: "Agent must chain tools manually"
      iliad: "Pre-built workflow patterns; tools aware of each other's outputs"
      agent_value: "Reduces agent planning overhead; higher success rate"

    - dimension: reliability_layer
      direct_competitor: "Provider SLAs only"
      iliad: "Iliad adds retry logic, caching, deduplication on top"
      agent_value: "Agents hate flaky tools; reliability premium is real"

    - dimension: budget_negotiation
      direct_competitor: "Fixed pricing"
      iliad: "X-Agent-Budget header; lite mode; 402 negotiation protocol"
      agent_value: "Budget-constrained agents stay on platform instead of leaving"

    - dimension: discovery
      direct_competitor: "Agent must know tool exists"
      iliad: "search_and_discover_tools routes intent → right tool automatically"
      agent_value: "Zero-friction onboarding for new agent workflows"

  moat_summary: >
    Iliad's moat is NOT the individual tools — it's the integrated experience:
    x402 payment rail + codebase intelligence + proxied ecosystem +
    single-credential discovery. This is not replicable by pointing agents
    directly at Firecrawl, Replicate, etc.

# ─────────────────────────────────────────────────────────────────────────────
# DEVELOPMENT PHASES
# ─────────────────────────────────────────────────────────────────────────────

phases:
  - phase: 1
    name: "Firecrawl Proxy — Web Research Tool"
    priority: critical
    estimated_effort: "3–5 days"
    why_first: >
      Highest agent demand (research is a universal workflow).
      Complements analyze_repo directly — agents want to pull external docs
      during code analysis. 100% markup achievable.
    deliverables:
      - "POST /v1/research/scrape — proxy to Firecrawl scrape endpoint"
      - "POST /v1/research/crawl — proxy to Firecrawl crawl endpoint"
      - "MCP tool: iliad_web_research with inputSchema matching Firecrawl"
      - "x402 gate at $0.005 per page request (includes Iliad markup)"
      - "Context enrichment: if X-Axis-Snapshot-Id header present, inject repo context into query"
      - "Add FIRECRAWL_API_KEY to env spec + render.yaml"
      - "Update /for-agents tool listing with iliad_web_research entry"
      - "Update openapi.ts with /v1/research/* paths"
    acceptance_criteria:
      - "Agent calls iliad_web_research via MCP → gets markdown scrape result"
      - "x402 fires correctly for unauthenticated or over-quota callers"
      - "Cost header X-Axis-Request-Cost reflects per-page pricing"
      - "All existing tests still pass"

  - phase: 2
    name: "Replicate Image Gen + Fastio Storage"
    priority: high
    estimated_effort: "3–4 days"
    deliverables:
      - "MCP tool: iliad_image_gen → proxy Replicate /v1/predictions"
      - "MCP tool: iliad_storage → proxy Fastio file tools (upload, download, list, delete)"
      - "x402 gates for both: image_gen @ $0.004/run, storage @ $0.001/MB"
      - "snapshot artifact auto-save: after analyze_repo, offer to persist artifacts to iliad_storage"
      - "Add REPLICATE_API_TOKEN + FASTIO_API_KEY to env spec"
    acceptance_criteria:
      - "Agent can generate an image from an MCP call through Iliad"
      - "Agent can store/retrieve files via MCP through Iliad"
      - "Costs reflected in x402 / X-Axis-Request-Cost headers"

  - phase: 3
    name: "Email (Resend) + Workflow Templates"
    priority: medium
    estimated_effort: "2–3 days"
    deliverables:
      - "MCP tool: iliad_send_email → REST proxy to Resend /emails"
      - "Pre-built email templates for: analysis report, audit result, payment confirmation"
      - "Workflow template: research_and_report (steps 1–6 from value_chain example)"
      - "GET /v1/workflows — returns available workflow templates"
      - "Add RESEND_API_KEY to env spec"
    acceptance_criteria:
      - "Agent calls iliad_send_email → email delivered via Resend"
      - "Workflow template endpoint returns structured step list consumable by agent planners"

  - phase: 4
    name: "Persistent Memory + Analytics"
    priority: medium
    estimated_effort: "4–5 days"
    deliverables:
      - "MCP tool: iliad_memory_set / iliad_memory_get — agent key/value store"
      - "Backed by SQLite (existing @axis/snapshots db) or Upstash if scale demands"
      - "Per-account memory namespace (no cross-account leakage)"
      - "Usage analytics dashboard for proxied tool consumption"
      - "Caching layer: deduplicate identical Firecrawl scrape requests within 1h TTL"
    acceptance_criteria:
      - "Agent persists data across sessions using iliad_memory_*"
      - "Cache prevents duplicate Firecrawl charges for identical URLs in same session"

  - phase: 5
    name: "Enterprise + White-label"
    priority: future
    estimated_effort: "2–3 weeks"
    deliverables:
      - "Dedicated instance option (self-hosted Docker)"
      - "No-log mode (no analytics stored)"
      - "Custom markup configuration per enterprise account"
      - "SLA + support tiers"
      - "White-label MCP endpoint (customer's domain, Iliad powered)"

# ─────────────────────────────────────────────────────────────────────────────
# IMPLEMENTATION CONSTRAINTS
# ─────────────────────────────────────────────────────────────────────────────

implementation_constraints:
  language: TypeScript
  framework: "Custom HTTP router (apps/api/src/router.ts) — no Express"
  payment_rail: "mppx x402 — all new paid tools MUST use existing chargeMpp pattern"
  auth: "Existing requireAuth / resolveAuth from billing.ts — no new auth systems"
  database: "@axis/snapshots SQLite — use for memory/caching where possible before adding Upstash"
  test_requirement: "All phases must maintain passing vitest suite (currently 4187 tests)"
  env_management: "Add new keys to apps/api/src/env.ts EnvSpec + .env.example + render.yaml"
  mcp_registration: "New tools added to MCP_TOOLS array in apps/api/src/mcp-server.ts with full inputSchema, outputSchema, examples, annotations"
  openapi: "New endpoints added to apps/api/src/openapi.ts — spec path count test must pass"
  for_agents: "New tools added to allTools array in handleForAgents (handlers.ts) with x_payment metadata"
  discovery_files: "Update .well-known/capabilities.json and /for-agents when new tools go live"

# ─────────────────────────────────────────────────────────────────────────────
# ANTI-PATTERNS (HARD BANS)
# ─────────────────────────────────────────────────────────────────────────────

anti_patterns:
  - "DO NOT build a custom web crawler — proxy Firecrawl"
  - "DO NOT build a custom email sender — proxy Resend"
  - "DO NOT build a custom image generator — proxy Replicate"
  - "DO NOT add a new auth system — use existing requireAuth"
  - "DO NOT add a new payment system — extend existing x402 rail"
  - "DO NOT add a new MCP framework — extend existing MCP_TOOLS array in mcp-server.ts"
  - "DO NOT compete on price with direct providers — compete on orchestration value"
  - "DO NOT launch Phase 2 before Phase 1 has paying agents"
  - "DO NOT add optional complexity to the front door (core analyze_repo flow must stay clean)"
