capabilities:
  - id: web_research
    name: "Web scrape (single URL → clean markdown)"
    status: live_proxy
    axis_brand_tool: "iliad_web_research"
    pricing_tier: "iliad_web_research"
    summary: "Fetch a URL, strip chrome and boilerplate, return reader-friendly markdown plus structured metadata."
    detected_in_repo: true
    detection_evidence:
      - "apps/api/src/env.ts references FIRECRAWL_API_KEY"
      - "source references /firecrawl\\.dev/ (e.g. iliad-agentic-platform-strategy.yaml)"
    third_party_providers:
      - name: "Firecrawl"
        url: "https://firecrawl.dev"
      - name: "ScrapingBee"
        url: "https://www.scrapingbee.com"
      - name: "Apify"
        url: "https://apify.com"
    inputs:
      - name: url
        type: "string"
        required: true
        description: "URL to scrape."
      - name: format
        type: "\"markdown\" | \"html\" | \"json\""
        required: false
        description: "Output format. Defaults to markdown."
      - name: include_links
        type: "boolean"
        required: false
        description: "Emit a links[] array alongside content."
    outputs:
      - name: markdown
        type: "string"
        description: "Reader-friendly markdown with chrome stripped."
      - name: title
        type: "string"
        description: "Page title (og:title, then <title>, then h1)."
      - name: links
        type: "string[]"
        description: "Outbound links, when include_links=true."
      - name: fetched_at
        type: "string (ISO 8601)"
        description: "Timestamp of the scrape."
    replication_plan:
      runtime: "Cloudflare Workers + Browser Rendering API, or self-hosted Playwright pool on RunPod"
      persistence: "Cloudflare KV cache, 24h TTL keyed by SHA-256(url)"
      estimated_effort: medium
      key_dependencies:
        - "playwright"
        - "@cloudflare/puppeteer"
        - "readability (Mozilla) for content extraction"
        - "cheerio (fallback)"
      differentiators:
        - "Network-wide 24h cache — popular URLs return free at full speed"
        - "Deterministic output — same URL + same fetched_at returns the same markdown"
        - "MCP-native return shape — no client SDK required, just JSON"

