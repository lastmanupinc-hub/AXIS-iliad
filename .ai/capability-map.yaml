      - "source references /firecrawl.*crawl/ (e.g. HARDENING_AUDIT.md)"
    third_party_providers:
      - name: "Firecrawl"
        url: "https://firecrawl.dev"
      - name: "Apify Web Scraper"
        url: "https://apify.com"
    inputs:
      - name: domain
        type: "string"
        required: true
        description: "Root domain to crawl. URLs outside the domain are not followed."
      - name: max_pages
        type: "number"
        required: false
        description: "Cap on pages returned. Lite mode = 5, standard = up to 100."
      - name: include_paths
        type: "string[]"
        required: false
        description: "Glob patterns restricting which paths to crawl."
    outputs:
      - name: pages
        type: "Array<{url, title, markdown, fetched_at}>"
        description: "Crawled pages."
