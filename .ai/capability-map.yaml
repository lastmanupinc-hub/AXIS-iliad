      - "apps/api/src/env.ts references R2_BUCKET"
      - "source references /r2\\.cloudflarestorage\\.com/ (e.g. apps/api/src/env.ts)"
    third_party_providers:
      - name: "AWS S3"
        url: "https://aws.amazon.com/s3/"
        retail_pricing: "$0.023/GB-month + egress"
      - name: "Cloudflare R2"
        url: "https://www.cloudflare.com/products/r2/"
        retail_pricing: "$0.015/GB-month, zero egress"
      - name: "Backblaze B2"
        url: "https://www.backblaze.com/b2/"
        retail_pricing: "$0.006/GB-month, $0.01/GB egress"
    inputs:
      - name: key
        type: "string"
        required: true
        description: "Object key."
      - name: operation
        type: "\"put\" | \"get\""
        required: true
        description: "Pre-sign upload or download."
      - name: ttl_seconds
        type: "number"
        required: false
        description: "Signed-URL lifetime. Defaults to 3600 (1h)."
    outputs:
      - name: url
        type: "string"
        description: "Pre-signed URL."
      - name: expires_at
        type: "string (ISO 8601)"
        description: "URL expiry timestamp."
    replication_plan:
      runtime: "Cloudflare R2 fronted by an AXIS-owned signing service (zero-egress is the killer feature)"
      persistence: "R2 buckets per account, lifecycle rules per tier"
      estimated_effort: small
      key_dependencies:
        - "@aws-sdk/s3-request-presigner (R2 is S3-compatible)"
        - "@cloudflare/r2"
      differentiators:
        - "Zero egress fees — predictable cost regardless of download volume"
        - "Account-scoped buckets with audit logging baked in"
        - "MCP-native signed-URL minting — no need to install an SDK"
    axis_advantages:
      - "R2's zero-egress model means AXIS-owned object storage is materially cheaper than S3 once download volume crosses ~10 GB/account/month"
      - "Already trusted infra (Cloudflare) — no new ops surface to monitor"

  - id: transactional_email
    name: "Transactional email (auth, receipts, notifications)"
    status: planned_proxy
    axis_brand_tool: ""
    pricing_tier: null
    summary: "Send a single transactional email with tracking, bounce handling, and DKIM/SPF."
    detected_in_repo: true
    detection_evidence:
      - "apps/api/src/env.ts references RESEND_API_KEY"
      - "source references /resend\\.com/ (e.g. apps/api/src/env.ts)"
    third_party_providers:
      - name: "Resend"
        url: "https://resend.com"
        retail_pricing: "$20/mo (50k emails) — current AXIS provider"
      - name: "Postmark"
        url: "https://postmarkapp.com"
        retail_pricing: "$15/mo (10k)"
      - name: "AWS SES"
        url: "https://aws.amazon.com/ses/"
        retail_pricing: "$0.10/1k emails"
    inputs:
      - name: to
        type: "string | string[]"
        required: true
        description: "Recipient(s)."
      - name: subject
        type: "string"
        required: true
        description: "Email subject."
      - name: body
        type: "{html?, text?}"
        required: true
        description: "HTML or plaintext body."
    outputs:
      - name: message_id
        type: "string"
        description: "Provider-assigned message ID."
      - name: delivered_to
        type: "string[]"
        description: "Recipients the provider accepted."
    replication_plan:
      runtime: "haraka or postal MTA on a hardened VPS, with R2-backed bounce / complaint log; AWS SES as the relay-of-last-resort"
      persistence: "Per-account suppression list (bounces, complaints) in the existing snapshot DB"
      estimated_effort: medium
      key_dependencies:
        - "haraka or postal"
        - "@aws-sdk/client-sesv2 (relay)"
      differentiators:
        - "Bounces and complaints surface directly in AXIS dashboards — no third-party log mining"
        - "Per-tenant DKIM signing key — emails ship under the customer's domain when configured"
        - "Suppression list shared across all AXIS tools (RAG outputs, marketing pack, etc.)"
    axis_advantages:
      - "Owning the MTA + relay split avoids Resend's per-email markup at scale (~$0.001/email vs $0.0004 own cost)"
      - "Bounce + complaint data feeds the deliverability scoring used by the marketing program"

  - id: vector_database
    name: "Vector database (semantic-search store)"
    status: owned
    axis_brand_tool: "iliad_vector_database"
    pricing_tier: null
    summary: "AXIS-owned vector store (SQLite-backed flat search with cosine similarity, per-namespace account isolation). Live as the iliad_vector_database MCP tool. Targets ≤10k vectors per namespace today; LanceDB-on-R2 upgrade is a future module swap with stable public signatures."
    detected_in_repo: false
    third_party_providers:
      - name: "Pinecone"
        url: "https://pinecone.io"
        retail_pricing: "$0.096/hr p2.x1 + storage"
      - name: "Qdrant Cloud"
        url: "https://qdrant.tech"
        retail_pricing: "$25/mo (4GB starter)"
      - name: "Weaviate Cloud"
        url: "https://weaviate.io"
        retail_pricing: "$25/mo (Sandbox+)"
    inputs:
      - name: operation
        type: "\"upsert\" | \"query\""
        required: true
        description: "Insert vectors or find nearest neighbors."
      - name: namespace
        type: "string"
        required: false
        description: "Logical isolation key. Defaults to the account ID."
      - name: vectors
        type: "Array<{id, vector, metadata}>"
        required: false
        description: "Vectors to upsert."
      - name: query
        type: "{vector, top_k, filter?}"
        required: false
        description: "Query parameters."
    outputs:
      - name: upserted
        type: "number"
        description: "Vectors written (upsert mode)."
      - name: matches
        type: "Array<{id, score, metadata}>"
        description: "Nearest neighbors (query mode)."
    replication_plan:
      runtime: "LanceDB (Apache 2.0, columnar) backed by R2; Qdrant on a small VPS as the high-recall tier"
      persistence: "LanceDB stores natively on R2 — no separate persistence layer"
      estimated_effort: medium
      key_dependencies:
        - "@lancedb/lancedb"
        - "qdrant (self-hosted)"
      differentiators:
        - "Columnar storage on R2 means free egress when serving results to the inference router"
        - "Account-scoped namespaces enforced server-side (no \"oops queried wrong index\" bugs)"
        - "Hybrid search (vector + BM25) is a built-in operation, not a separate API call"
    axis_advantages:
      - "LanceDB-on-R2 storage cost ≈ $0.015/GB-month vs Pinecone's $0.096/hr per p2.x1 (orders of magnitude cheaper at low scale)"
      - "No per-pod fees — query throughput scales with the inference router instead"
      - "Same auth + billing surface as the rest of the AXIS tool stack"

  - id: analytics
    name: "Product analytics (events + funnels + cohorts)"
    status: planned_proxy
    axis_brand_tool: ""
    pricing_tier: null
    summary: "Record arbitrary user events and query funnels, cohorts, and retention curves."
    detected_in_repo: true
    detection_evidence:
      - "source references /posthog/ (e.g. apps/api/src/mcp-server.ts)"
    third_party_providers:
      - name: "PostHog Cloud"
        url: "https://posthog.com"
        retail_pricing: "$0/mo (1M events) → $0.00031/event (Scale)"
      - name: "Plausible"
        url: "https://plausible.io"
        retail_pricing: "$9/mo (10k pageviews)"
      - name: "Mixpanel"
        url: "https://mixpanel.com"
        retail_pricing: "$0.83/MTU (Growth)"
    inputs:
      - name: operation
        type: "\"capture\" | \"query\""
        required: true
        description: "Record an event or run an analytics query."
      - name: event
        type: "{name, distinct_id, properties}"
        required: false
        description: "Event payload (capture mode)."
      - name: query
        type: "{funnel?, cohort?, retention?}"
        required: false
        description: "Analytics query (query mode)."
    outputs:
      - name: result
        type: "object"
        description: "Capture confirmation or query results."
    replication_plan:
      runtime: "PostHog OSS (Elastic 2.0) self-hosted on a small VPS for the long term — same UI, no metered billing"
      persistence: "PostgreSQL + ClickHouse stack (PostHog defaults), R2 cold storage for events > 90 days"
      estimated_effort: medium
      key_dependencies:
        - "posthog-ee (self-hosted)"
        - "clickhouse"
        - "kafka for ingestion buffer"
      differentiators:
        - "Identical PostHog query API — migrate by changing the host, no schema changes"
        - "Account-scoped projects with billing-line attribution baked in"
        - "Free tier covers what the proxy currently includes (1M events/month) — same UX as PostHog Cloud"
    axis_advantages:
      - "PostHog OSS at our scale costs ≈ $50/mo VPS + storage vs $1k+/mo PostHog Cloud at the same event volume"
      - "Self-hosted means session-replay PII never leaves AXIS infra — material compliance win"

