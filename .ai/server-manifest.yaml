            description: Primary key or identifier for PushPayload
          filter:
            type: object
            description: Optional filter criteria

    - name: query_snapshottarget
      description: Query SnapshotTarget records (interface, 5 fields)
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for SnapshotTarget
          filter:
            type: object
