    - name: query_analyticsdistinctusersresult
      description: "Query AnalyticsDistinctUsersResult records (interface, 2 fields)"
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for AnalyticsDistinctUsersResult
          filter:
            type: object
            description: Optional filter criteria

    - name: query_analyticsevent
      description: "Query AnalyticsEvent records (interface, 4 fields)"
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for AnalyticsEvent
          filter:
            type: object
            description: Optional filter criteria

    - name: query_analyticsquery
      description: "Query AnalyticsQuery records (interface, 8 fields)"
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for AnalyticsQuery
          filter:
            type: object
            description: Optional filter criteria

  resources:
    - uri: project://context-map
      name: Project Context Map
      mime_type: application/json
      description: Full project context including structure, detection, and architecture signals

    - uri: project://repo-profile
      name: Repository Profile
      mime_type: application/yaml
      description: Repository health, structure summary, and detection results

    - uri: project://architecture-summary
      name: Architecture Summary
      mime_type: text/markdown
      description: Human-readable architecture overview

    # showing 15 of 242 domain-model resources
    - uri: "model://AlertThresholds"
      name: AlertThresholds
      mime_type: application/json
      description: interface with 2 fields (apps/api/src/alerting.ts)

    - uri: "model://Counters"
      name: Counters
      mime_type: application/json
      description: type_alias with 2 fields (apps/api/src/alerting.ts)

    - uri: "model://DebounceState"
      name: DebounceState
      mime_type: application/json
      description: interface with 2 fields (apps/api/src/alerting.ts)

    - uri: "model://WindowResult"
      name: WindowResult
      mime_type: application/json
      description: interface with 4 fields (apps/api/src/alerting.ts)

    - uri: "model://AnalyticsCountByBucketResult"
      name: AnalyticsCountByBucketResult
      mime_type: application/json
      description: interface with 3 fields (apps/api/src/analytics.ts)

    - uri: "model://AnalyticsCountByBucketRow"
      name: AnalyticsCountByBucketRow
      mime_type: application/json
      description: interface with 2 fields (apps/api/src/analytics.ts)

    - uri: "model://AnalyticsCountByEventResult"
      name: AnalyticsCountByEventResult
      mime_type: application/json
      description: interface with 2 fields (apps/api/src/analytics.ts)

    - uri: "model://AnalyticsCountByEventRow"
      name: AnalyticsCountByEventRow
      mime_type: application/json
      description: interface with 2 fields (apps/api/src/analytics.ts)

    - uri: "model://AnalyticsCountResult"
      name: AnalyticsCountResult
      mime_type: application/json
      description: interface with 2 fields (apps/api/src/analytics.ts)

    - uri: "model://AnalyticsDistinctUsersResult"
      name: AnalyticsDistinctUsersResult
      mime_type: application/json
      description: interface with 2 fields (apps/api/src/analytics.ts)

    - uri: "model://AnalyticsEvent"
      name: AnalyticsEvent
      mime_type: application/json
      description: interface with 4 fields (apps/api/src/analytics.ts)

    - uri: "model://AnalyticsQuery"
      name: AnalyticsQuery
      mime_type: application/json
      description: interface with 8 fields (apps/api/src/analytics.ts)

    - uri: "model://WhereClause"
      name: WhereClause
      mime_type: application/json
      description: interface with 2 fields (apps/api/src/analytics.ts)

    - uri: "model://DriftDeps"
      name: DriftDeps
      mime_type: application/json
      description: interface with 5 fields (apps/api/src/architecture-drift-webhook.ts)

    - uri: "model://DriftOutcome"
      name: DriftOutcome
      mime_type: application/json
      description: interface with 3 fields (apps/api/src/architecture-drift-webhook.ts)

  prompts:
    - name: review_code
      description: Review code following axis-iliad conventions
      arguments:
        - name: file_path
          type: string
          required: true

    - name: debug_issue
      description: Debug an issue using project-specific playbooks
      arguments:
        - name: error_message
          type: string
          required: true
        - name: stack_trace
          type: string

  runtime:
    language: TypeScript
    entry: "src/index.ts"
    env:
      - name: AXIS_PROJECT_ID
        required: true
      - name: AXIS_API_URL
        default: "http://localhost:4000"

  dependencies:
    # showing 8 of 32 dependencies
    - name: "@axis/context-engine"
      version: "workspace:*"
    - name: "@axis/generator-core"
      version: "workspace:*"
    - name: "@axis/mpp"
      version: "workspace:*"
    - name: "@axis/paid-client"
      version: "workspace:*"
    - name: "@axis/repo-parser"
      version: "workspace:*"
    - name: "@axis/snapshots"
      version: "workspace:*"
    - name: "@jmondi/oauth2-server"
      version: "^4.2.2"
    - name: dockerode
      version: "^4.0.12"

  # Detected Server/Tool Files
  source_files:
    - path: "SETUP_PAID_STRIPE_MCP.md"
      exports: []
    - path: "apps/api/mcp-server.json"
      exports: []
    - path: "apps/api/src/mcp-runtime.ts"
      exports: ["export const REGISTRY_DISPLAY_NAME = ...", "export const SERVER_SLUG = ...", "export const REGISTRY_VERSION = ...", "export const RPC_PARSE_ERROR = ...", "export const RPC_INVALID_REQUEST = ..."]
    - path: "apps/api/src/mcp-server.test.ts"
      exports: []
    - path: "apps/api/src/mcp-server.ts"
      exports: ["export { ... }", "export { ... }", "export const MCP_PROTOCOL_VERSION = ...", "export async function logMcpCall(toolName: string, userId: string | null, ip: string, headers?: Record<string, string | ", "export function getMcpCallCounters(): McpCallCounters { ... }"]
    - path: "apps/api/src/mcp-tool-impls.ts"
      exports: ["export function runPlannedCapability(capability: PlannedCapability): string { ... }", "export async function runObjectStorage(args: Record<string, unknown>, req: IncomingMessage): Promise<string> { ... }", "export async function runTransactionalEmail(args: Record<string, unknown>, req: IncomingMessage): Promise<string> { ... ", "export async function runEmbeddings(args: Record<string, unknown>, req: IncomingMessage): Promise<string> { ... }", "export async function runVectorDatabase(args: Record<string, unknown>, req: IncomingMessage): Promise<string> { ... }"]
    - path: "apps/api/src/mcp-tools.ts"
      exports: ["export interface PlannedCapability { ... }", "export const PLANNED_CAPABILITIES: readonly PlannedCapability[] = ...", "export const PLANNED_CAPABILITY_NAMES: ReadonlySet<string> = ...", "export const MCP_TOOLS = ..."]
    - path: "apps/api/src/oauth-server.ts"
      exports: ["export async function handleOAuthAuthorize(req: IncomingMessage, res: ServerResponse): Promise<void> { ... }", "export async function handleOAuthToken(req: IncomingMessage, res: ServerResponse): Promise<void> { ... }", "export async function handleOAuthJwks(_req: IncomingMessage, res: ServerResponse): Promise<void> { ... }", "export async function handleOAuthIntrospect(req: IncomingMessage, res: ServerResponse): Promise<void> { ... }", "export async function requireBearerToken(req: IncomingMessage, res: ServerResponse): Promise<boolean> { ... }"]
