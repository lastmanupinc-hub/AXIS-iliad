# MCP Server Manifest
# Project: axis-iliad
# Generated: 1970-01-01T00:00:00.000Z
# Summary: axis-iliad is a monorepo built with TypeScript using React. It contains 500 files across 9 top-level directories. It defines 278 domain models.

server:
  name: "axis-iliad-mcp-server"
  version: "1.0.0"
  description: "MCP server for axis-iliad project integration"
  protocol: "mcp"
  transport: "stdio"

  capabilities:
    tools: true
    resources: true
    prompts: true

  tools:
    - name: analyze_project
      description: Run full project analysis and return context map
      input_schema:
        type: object
        properties:
          depth:
            type: string
            enum: [quick, standard, deep]
            default: standard

    - name: search_code
      description: Search project codebase by pattern or semantic query
      input_schema:
        type: object
        required: [query]
        properties:
          query:
            type: string
          file_pattern:
            type: string

    - name: generate_files
      description: Generate output files for a specific program
      input_schema:
        type: object
        required: [program]
        properties:
          program:
            type: string
            enum: [search, skills, debug, frontend, seo, optimization, theme, brand, superpowers, marketing, notebook, obsidian, mcp, artifacts, remotion, canvas, algorithmic, agentic-purchasing, closer, deploy]

    - name: list_routes
      description: List all 174 detected routes
      input_schema:
        type: object
        properties:
          method:
            type: string
            enum: [GET, POST, PUT, DELETE, PATCH]

    # showing 12 of 278 domain-model query tools
    - name: query_alertthresholds
      description: "Query AlertThresholds records (interface, 2 fields)"
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for AlertThresholds
          filter:
            type: object
            description: Optional filter criteria

    - name: query_counters
      description: "Query Counters records (type_alias, 2 fields)"
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for Counters
          filter:
            type: object
            description: Optional filter criteria

    - name: query_debouncestate
      description: "Query DebounceState records (interface, 2 fields)"
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for DebounceState
          filter:
            type: object
            description: Optional filter criteria

    - name: query_windowresult
      description: "Query WindowResult records (interface, 4 fields)"
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for WindowResult
          filter:
            type: object
            description: Optional filter criteria

    - name: query_analyticscountbybucketresult
      description: "Query AnalyticsCountByBucketResult records (interface, 3 fields)"
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for AnalyticsCountByBucketResult
          filter:
            type: object
            description: Optional filter criteria

    - name: query_analyticscountbybucketrow
      description: "Query AnalyticsCountByBucketRow records (interface, 2 fields)"
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for AnalyticsCountByBucketRow
          filter:
            type: object
            description: Optional filter criteria

    - name: query_analyticscountbyeventresult
      description: "Query AnalyticsCountByEventResult records (interface, 2 fields)"
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for AnalyticsCountByEventResult
          filter:
            type: object
            description: Optional filter criteria

    - name: query_analyticscountbyeventrow
      description: "Query AnalyticsCountByEventRow records (interface, 2 fields)"
      input_schema:
        type: object
