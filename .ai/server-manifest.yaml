# MCP Server Manifest
# Project: axis-iliad
# Generated: 2026-05-22T22:06:46.827Z
# Summary: axis-iliad is a monorepo built with TypeScript using React. It contains 500 files across 17 top-level directories. It defines 264 domain models.

server:
  name: "axis-iliad-mcp-server"
  version: "1.0.0"
  description: "MCP server for axis-iliad project integration"
  protocol: "mcp"
  transport: "stdio"

  capabilities:
    tools: true
    resources: true
    prompts: true

  tools:
    - name: analyze_project
      description: Run full project analysis and return context map
      input_schema:
        type: object
        properties:
          depth:
            type: string
            enum: [quick, standard, deep]
            default: standard

    - name: search_code
      description: Search project codebase by pattern or semantic query
      input_schema:
        type: object
        required: [query]
        properties:
          query:
            type: string
          file_pattern:
            type: string

    - name: generate_files
      description: Generate output files for a specific program
      input_schema:
        type: object
        required: [program]
        properties:
          program:
            type: string
            enum: [search, debug, skills, frontend, seo, optimization, theme, brand, superpowers, marketing, notebook, obsidian, mcp, artifacts, remotion, canvas, algorithmic]

    - name: list_routes
      description: List all 497 detected routes
      input_schema:
        type: object
        properties:
          method:
            type: string
            enum: [GET, POST, PUT, DELETE, PATCH]

    - name: query_authcontext
      description: Query AuthContext records (interface, 3 fields)
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for AuthContext
          filter:
            type: object
            description: Optional filter criteria

    - name: query_emailconfig
      description: Query EmailConfig records (interface, 2 fields)
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for EmailConfig
          filter:
            type: object
            description: Optional filter criteria

    - name: query_resenderrorresponse
      description: Query ResendErrorResponse records (interface, 3 fields)
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for ResendErrorResponse
          filter:
            type: object
            description: Optional filter criteria

    - name: query_resendsuccessresponse
      description: Query ResendSuccessResponse records (interface, 1 fields)
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for ResendSuccessResponse
          filter:
            type: object
            description: Optional filter criteria

    - name: query_sendemailoptions
      description: Query SendEmailOptions records (interface, 5 fields)
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for SendEmailOptions
          filter:
            type: object
            description: Optional filter criteria

    - name: query_sendemailresult
      description: Query SendEmailResult records (interface, 4 fields)
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for SendEmailResult
          filter:
            type: object
            description: Optional filter criteria

    - name: query_embeddingsconfig
      description: Query EmbeddingsConfig records (interface, 2 fields)
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for EmbeddingsConfig
          filter:
            type: object
            description: Optional filter criteria

    - name: query_embeddingsresult
      description: Query EmbeddingsResult records (interface, 4 fields)
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for EmbeddingsResult
          filter:
            type: object
            description: Optional filter criteria

    - name: query_openaiembeddingresponse
      description: Query OpenAIEmbeddingResponse records (interface, 5 fields)
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for OpenAIEmbeddingResponse
          filter:
            type: object
            description: Optional filter criteria

    - name: query_openaierrorresponse
      description: Query OpenAIErrorResponse records (interface, 3 fields)
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for OpenAIErrorResponse
          filter:
            type: object
            description: Optional filter criteria

    - name: query_envspec
      description: Query EnvSpec records (interface, 5 fields)
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for EnvSpec
          filter:
            type: object
            description: Optional filter criteria

    - name: query_validationerror
      description: Query ValidationError records (interface, 2 fields)
      input_schema:
        type: object
        properties:
          id:
            type: string
            description: Primary key or identifier for ValidationError
          filter:
            type: object
            description: Optional filter criteria

  resources:
    - uri: project://context-map
      name: Project Context Map
      mime_type: application/json
      description: Full project context including structure, detection, and architecture signals

    - uri: project://repo-profile
      name: Repository Profile
      mime_type: application/yaml
      description: Repository health, structure summary, and detection results

    - uri: project://architecture-summary
      name: Architecture Summary
      mime_type: text/markdown
      description: Human-readable architecture overview

    - uri: model://AuthContext
      name: AuthContext
      mime_type: application/json
      description: interface with 3 fields (apps/api/src/billing.ts)

    - uri: model://EmailConfig
      name: EmailConfig
      mime_type: application/json
      description: interface with 2 fields (apps/api/src/email.ts)

    - uri: model://ResendErrorResponse
      name: ResendErrorResponse
      mime_type: application/json
      description: interface with 3 fields (apps/api/src/email.ts)

    - uri: model://ResendSuccessResponse
      name: ResendSuccessResponse
      mime_type: application/json
      description: interface with 1 field (apps/api/src/email.ts)

    - uri: model://SendEmailOptions
      name: SendEmailOptions
      mime_type: application/json
      description: interface with 5 fields (apps/api/src/email.ts)

    - uri: model://SendEmailResult
      name: SendEmailResult
      mime_type: application/json
      description: interface with 4 fields (apps/api/src/email.ts)

    - uri: model://EmbeddingsConfig
      name: EmbeddingsConfig
      mime_type: application/json
      description: interface with 2 fields (apps/api/src/embeddings.ts)

    - uri: model://EmbeddingsResult
      name: EmbeddingsResult
      mime_type: application/json
      description: interface with 4 fields (apps/api/src/embeddings.ts)

    - uri: model://OpenAIEmbeddingResponse
      name: OpenAIEmbeddingResponse
      mime_type: application/json
      description: interface with 5 fields (apps/api/src/embeddings.ts)

    - uri: model://OpenAIErrorResponse
      name: OpenAIErrorResponse
      mime_type: application/json
      description: interface with 3 fields (apps/api/src/embeddings.ts)

    - uri: model://EnvSpec
      name: EnvSpec
      mime_type: application/json
      description: interface with 5 fields (apps/api/src/env.ts)

    - uri: model://ValidationError
      name: ValidationError
      mime_type: application/json
      description: interface with 2 fields (apps/api/src/env.ts)

    - uri: model://ValidationResult
      name: ValidationResult
      mime_type: application/json
      description: interface with 3 fields (apps/api/src/env.ts)

    - uri: model://ZipEntry
      name: ZipEntry
      mime_type: application/json
      description: interface with 4 fields (apps/api/src/export.ts)

    - uri: model://PullRequestPayload
      name: PullRequestPayload
      mime_type: application/json
      description: interface with 5 fields (apps/api/src/github-webhook.ts)

  prompts:
    - name: review_code
      description: Review code following axis-iliad conventions
      arguments:
        - name: file_path
          type: string
          required: true

    - name: debug_issue
      description: Debug an issue using project-specific playbooks
      arguments:
        - name: error_message
          type: string
          required: true
        - name: stack_trace
          type: string

  runtime:
    language: TypeScript
    entry: "src/index.ts"
    env:
      - name: AXIS_PROJECT_ID
        required: true
      - name: AXIS_API_URL
        default: "http://localhost:4000"

  dependencies:
    - name: @axis/context-engine
      version: "workspace:*"
    - name: @axis/generator-core
      version: "workspace:*"
    - name: @axis/mpp
      version: "workspace:*"
    - name: @axis/repo-parser
      version: "workspace:*"
    - name: @axis/snapshots
      version: "workspace:*"
    - name: @jmondi/oauth2-server
      version: "^4.2.2"
    - name: jsonwebtoken
      version: "^9.0.3"
    - name: mppx
      version: "^0.5.12"

  # Detected Server/Tool Files
  source_files:
    - path: "apps/api/mcp-server.json"
      exports: []
    - path: "apps/api/src/mcp-server.test.ts"
      exports: []
    - path: "apps/api/src/mcp-server.ts"
      exports: ["export const MCP_PROTOCOL_VERSION = ...", "export type ProbeClass = ...", "export function classifyProbe(userAgent: string): ProbeClass { ... }", "export function captureIntent(tool: string, intent: string | null, userAgent: string): void { ... }", "export function getIntentLog(): IntentCapture[] { ... }"]
    - path: "apps/api/src/oauth-server.ts"
      exports: ["export async function handleOAuthAuthorize(req: IncomingMessage, res: ServerResponse): Promise<void> { ... }", "export async function handleOAuthToken(req: IncomingMessage, res: ServerResponse): Promise<void> { ... }", "export async function handleOAuthJwks(_req: IncomingMessage, res: ServerResponse): Promise<void> { ... }", "export async function handleOAuthIntrospect(req: IncomingMessage, res: ServerResponse): Promise<void> { ... }", "export async function requireBearerToken(req: IncomingMessage, res: ServerResponse): Promise<boolean> { ... }"]
    - path: "apps/api/src/server.ts"
      exports: ["export const app = ..."]
    - path: "mcp/begin.yaml"
      exports: []
    - path: "mcp/build-artifacts.md"
      exports: []
    - path: "mcp/continuation.yaml"
      exports: []
