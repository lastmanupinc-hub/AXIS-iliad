# docker compose for axis-iliad
# Usage:
#   cp .env.example .env  (if present)
#   docker compose up --build
#
# Reads PORT from .env; defaults to 8080.

services:
  app:
    image: axis-iliad:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axis-iliad
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - PRODUCT_NAME=axis-iliad
      - NODE_ENV=production
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5