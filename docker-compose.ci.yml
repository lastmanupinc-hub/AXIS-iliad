# ─── Local CI (docker) ──────────────────────────────────────────────────────
#
# THE verification gate for this repository as of 2026-08-08 (garage doctrine:
# GitHub Actions is unfunded; "green here" means what "green in CI" used to).
#
#   run:            scripts/ci-local.sh
#   or directly:    docker compose -f docker-compose.ci.yml up
#                     --build --abort-on-container-exit --exit-code-from ci
#
# ISOLATION, learned the hard way: the first design bind-mounted the repo
# read-write and the container's pnpm install REWROTE THE HOST'S node_modules
# with Linux binaries mid-run — corrupting the environment the gate exists to
# protect, at bind-mount I/O speeds that stretched install past an hour. The
# gate now builds Dockerfile.ci (COPY, like the production Dockerfile): the
# container works on its own copy and cannot see the host. Install + D2 live
# in cached image layers, so repeat runs with an unchanged lockfile skip them
# entirely. Results leave as the exit code and the log — the only channels a
# gate needs. Nothing on the host is written, ever.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: axis_test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 24
      # First boot runs initdb before accepting connections; the maiden run
      # died here ("dependency failed to start: postgres unhealthy") while
      # initdb was mid-flight. start_period excludes that window entirely.
      start_period: 60s

  ci:
    build:
      context: .
      dockerfile: Dockerfile.ci
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /repo
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/axis_test
      CI: "true"
    command:
      - bash
      - -ceu
      - |
        echo "=== [1/5] build (full workspace) ==="
        pnpm run build
        echo "=== [2/5] tests (full + coverage, real Postgres, real D2) ==="
        npx vitest run --coverage --coverage.provider=v8 --coverage.reporter=text-summary --coverage.reportDir=coverage
        echo "=== [3/5] typecheck ==="
        pnpm -r exec tsc --noEmit
        echo "=== [4/5] lint ==="
        pnpm lint
        echo "=== [5/5] artifact freshness gate ==="
        npx tsx scripts/check-artifact-freshness.ts
        echo "=== LOCAL CI GREEN ==="
