version: 2

# H8.12 — weekly, grouped minor/patch, majors labeled for discussion, never
# auto-merged. No auto-merge automation exists anywhere in this repo (checked
# before writing this file) — that half of the repo law is satisfied by
# simply never adding one, not by anything below.
#
# Dependabot's own schema has no "label only major-version PRs" primitive —
# `labels` applies uniformly to every PR an update block opens (grouped or
# not), and `groups` doesn't carry its own label override. So the
# `deps-discussion` half of "majors labeled deps-discussion" is enforced at
# triage time, by hand, on whichever PRs Dependabot opens outside the
# minor/patch group (i.e. major-version bumps) — not something this config
# file can mechanically guarantee for every future PR on its own.
updates:
  # npm/pnpm workspace (single root pnpm-lock.yaml covers apps/* + packages/*).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        # MONEY-PATH EXCLUSION (ops_02, 2026-08-05). mppx must never ride inside
        # a grouped PR. It is a 0.x package, so semver treats its MINOR bumps as
        # BREAKING ranges, and it is what apps/api/src/cashier.ts and mpp.ts
        # import — the only checkout rail. HARDEN_POLISH_LOOP.md §7's money-path
        # law requires red-before-green demonstration for changes there, which a
        # batch labelled "minor-and-patch" actively discourages.
        #
        # This is not hypothetical. Dependabot proposed exactly that twice:
        # PR #241 carried mppx 0.5.12 -> 0.8.14 among 11 updates, and after the
        # safe members were taken individually it regrouped the remainder into
        # #253 with 0.8.15 still inside. The grouping is semver-literal and
        # cannot know this repo has a money path; the label invites a rubber
        # stamp. Excluding it means the bump always arrives as its own visible
        # PR that has to be reasoned about on its own.
        exclude-patterns:
          - "mppx"

  # Root Dockerfile (axis-api's Render build).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Pinned Action versions across every .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
