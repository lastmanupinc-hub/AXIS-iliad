name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # break-glass: manually re-run the deploy jobs below

# Only the newest run per ref survives. For main this means the latest merge's
# build+deploy wins the :latest tag (no race between concurrent merges); for PRs
# it cancels runs superseded by a newer push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    # Phase 6 of the Neon migration: the suite runs against a real Postgres
    # (the data layer is async pg; tests provision/truncate via resetTestDb).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5 # version comes from package.json "packageManager"

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Build all packages
        run: pnpm -r build

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/axis_test
        run: npx vitest run --coverage --coverage.provider=v8 --coverage.reporter=text --coverage.reporter=json-summary --coverage.reportDir=coverage

      - name: Type-check
        run: pnpm -r exec tsc --noEmit

      - name: Artifact freshness gate
        run: npx tsx scripts/check-artifact-freshness.ts

      - name: Upload coverage report
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    # Break-glass only: Render now builds the API from ./Dockerfile on push
    # (docker-from-Git Blueprint), so we no longer build+push a GHCR image every
    # merge. Run manually via "Run workflow" to refresh the fallback image.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    # The Neon-migrated app runs DB migrations at startup, so the boot smoke-test
    # needs a real Postgres (mirrors build-and-test). The container reaches it via
    # --network host → localhost:5432.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/lastmanupinc-hub/axis-api:latest \
            -t ghcr.io/lastmanupinc-hub/axis-api:${{ github.sha }} \
            .

      - name: Verify Docker health check
        run: |
          # Smoke-test that the image BOOTS, runs its startup DB migrations, and
          # serves HTTP — against a real Postgres (the Neon data layer requires a DB
          # at startup). --network host lets the container reach the postgres service
          # on localhost:5432; probe the DB-free liveness endpoint once booted.
          docker run -d --name axis-test --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/axis_test \
            ghcr.io/lastmanupinc-hub/axis-api:${{ github.sha }}
          for i in 1 2 3 4 5 6; do
            if curl -sf http://localhost:4000/v1/health/live | grep -q '"status":"alive"'; then
              echo "Health check passed on attempt $i"
              break
            fi
            if [ "$i" -eq 6 ]; then
              echo "All attempts failed. Container logs:"
              docker logs axis-test
            fi
            sleep 5
          done
          curl -sf http://localhost:4000/v1/health/live | grep -q '"status":"alive"'
          docker stop axis-test
          docker rm axis-test

      - name: Push to GHCR
        run: |
          docker push ghcr.io/lastmanupinc-hub/axis-api:latest
          docker push ghcr.io/lastmanupinc-hub/axis-api:${{ github.sha }}

  # ── Deploy API to Render ──────────────────────────────────────────
  # Render serves the image built+pushed above. This job triggers the pull via a
  # Render Deploy Hook so every merge to main auto-deploys (replacing the manual
  # API trigger). Add the RENDER_DEPLOY_HOOK_URL repo secret (Render → axis-api →
  # Settings → Deploy Hook). Until it's set, this job warns and passes — it never
  # blocks CI. Combined with the concurrency group above, only the newest merge's
  # image is deployed, so there is no :latest race.
  deploy-api:
    runs-on: ubuntu-latest
    needs: docker-build
    # Break-glass only: Render auto-deploys the API from Git on push, so the
    # deploy hook no longer fires every merge (that was double-deploying + backing
    # up the queue). Run manually to force an image-based redeploy if reverting.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Render deploy of the freshly-pushed image
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL not set — skipping auto-deploy. Add it under Settings → Secrets → Actions (create the hook in Render → axis-api → Settings → Deploy Hook)."
            exit 0
          fi
          code=$(curl -sS -X POST -o /dev/null -w "%{http_code}" "$RENDER_DEPLOY_HOOK_URL")
          echo "Render deploy hook → HTTP $code"
          test "$code" = "200"

  # G��G�� Deploy API to Render G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��
  # Render pulls the pre-built image from ghcr.io/lastmanupinc-hub/axis-api:latest
  # Configure Render service to use "Image" deploy with that URL.
  # No build minutes consumed G�� image is built by GitHub Actions above.

  # G��G�� Deploy Web to Cloudflare Pages G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��
  deploy-web:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5 # version comes from package.json "packageManager"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        env:
          # Same-site with the web origin so the HttpOnly axis_session cookie rides (H1 cutover).
          VITE_API_URL: https://api.iliad.trustfabric.ai
        run: pnpm -r build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages deploy apps/web/dist --project-name=axis-web --commit-dirty=true
        continue-on-error: true

  # H6.3 — live-probe battery: a repeatable version of the manual "July systems
  # check" (health/ready, MCP tools count, PAI'D config, anon 413 gate, web
  # bundle marker). Non-gating by design: axis-api's real deploy path is
  # Render's own independent Blueprint sync (not this workflow), so "just
  # pushed" doesn't mean "already live" on any fixed timeline this job could
  # wait for — this reports current production state, it never blocks a merge.
  # No dependencies (pure native fetch), so no pnpm install needed.
  live-probe:
    runs-on: ubuntu-latest
    needs: deploy-web
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run live-probe battery
        run: node scripts/live-probe.mjs
