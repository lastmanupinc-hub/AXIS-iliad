name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # break-glass: manually re-run the deploy jobs below, or force a full regression
    inputs:
      full_regression:
        description: "Run the full suite (ignore affected-package narrowing)"
        type: boolean
        default: false

# Only the newest run per ref survives. For main this means the latest merge's
# build+deploy wins the :latest tag (no race between concurrent merges); for PRs
# it cancels runs superseded by a newer push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Every push/PR used to run the ENTIRE suite twice (Node 20 + 22) regardless
  # of how small the change was. This job narrows that to the packages a
  # change actually touches, plus everything that depends on them (pnpm's own
  # dependency-graph filter, not a hand-rolled one) — see scripts/ci-affected.mjs
  # for the full design and its fail-safe-to-full rules. The comprehensive,
  # always-full regression now runs nightly instead (nightly.yml) and on
  # demand (workflow_dispatch's full_regression input above).
  determine-affected:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.affected.outputs.full }}
      packages: ${{ steps.affected.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history required: both git diff and pnpm's "...[ref]" filter need it

      - uses: pnpm/action-setup@v5 # version comes from package.json "packageManager"

      # No `cache` input here, and caching must stay OFF: this job never runs
      # `pnpm install` (it only needs pnpm's CLI for the "...[ref]"
      # dependency-graph filter against the checked-out tree), so there is
      # never a populated store for the Post step to save. Root cause
      # (2026-07-31): actions/setup-node@v7's own `package-manager-cache`
      # input defaults to true and auto-enables caching whenever
      # package.json has a "packageManager" field — regardless of whether
      # `cache:` is set — so explicitly declaring `cache: pnpm` here (tried
      # first) changed nothing; the auto-detected cache was already on. The
      # Post step then shells out to resolve the pnpm store path, finds
      # nothing was ever installed into it, and hard-fails with a Path
      # Validation Error, skipping every downstream job (build-and-test,
      # docker-build, both deploys) on every push. build-and-test/deploy-web
      # don't hit this because they run `pnpm install` right after this step,
      # giving the Post step a real store to save. `package-manager-cache:
      # false` below turns off the auto-detection for good.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Resolve base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.full_regression }}" = "true" ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
              echo "ref=" >> "$GITHUB_OUTPUT"
            else
              echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine affected packages
        id: affected
        run: node scripts/ci-affected.mjs "${{ steps.base.outputs.ref }}"

  build-and-test:
    needs: determine-affected
    uses: ./.github/workflows/reusable-test-suite.yml
    with:
      full: ${{ needs.determine-affected.outputs.full == 'true' }}
      packages: ${{ needs.determine-affected.outputs.packages }}

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    # Break-glass only: Render now builds the API from ./Dockerfile on push
    # (docker-from-Git Blueprint), so we no longer build+push a GHCR image every
    # merge. Run manually via "Run workflow" to refresh the fallback image.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    # The Neon-migrated app runs DB migrations at startup, so the boot smoke-test
    # needs a real Postgres (mirrors build-and-test). The container reaches it via
    # --network host → localhost:5432.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/lastmanupinc-hub/axis-api:latest \
            -t ghcr.io/lastmanupinc-hub/axis-api:${{ github.sha }} \
            .

      - name: Verify Docker health check
        run: |
          # Smoke-test that the image BOOTS, runs its startup DB migrations, and
          # serves HTTP — against a real Postgres (the Neon data layer requires a DB
          # at startup). --network host lets the container reach the postgres service
          # on localhost:5432; probe the DB-free liveness endpoint once booted.
          docker run -d --name axis-test --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/axis_test \
            ghcr.io/lastmanupinc-hub/axis-api:${{ github.sha }}
          for i in 1 2 3 4 5 6; do
            if curl -sf http://localhost:4000/v1/health/live | grep -q '"status":"alive"'; then
              echo "Health check passed on attempt $i"
              break
            fi
            if [ "$i" -eq 6 ]; then
              echo "All attempts failed. Container logs:"
              docker logs axis-test
            fi
            sleep 5
          done
          curl -sf http://localhost:4000/v1/health/live | grep -q '"status":"alive"'
          docker stop axis-test
          docker rm axis-test

      - name: Push to GHCR
        run: |
          docker push ghcr.io/lastmanupinc-hub/axis-api:latest
          docker push ghcr.io/lastmanupinc-hub/axis-api:${{ github.sha }}

  # ── Deploy API to Render ──────────────────────────────────────────
  # Render serves the image built+pushed above. This job triggers the pull via a
  # Render Deploy Hook so every merge to main auto-deploys (replacing the manual
  # API trigger). Add the RENDER_DEPLOY_HOOK_URL repo secret (Render → axis-api →
  # Settings → Deploy Hook). Until it's set, this job warns and passes — it never
  # blocks CI. Combined with the concurrency group above, only the newest merge's
  # image is deployed, so there is no :latest race.
  deploy-api:
    runs-on: ubuntu-latest
    needs: docker-build
    # Break-glass only: Render auto-deploys the API from Git on push, so the
    # deploy hook no longer fires every merge (that was double-deploying + backing
    # up the queue). Run manually to force an image-based redeploy if reverting.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Render deploy of the freshly-pushed image
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL not set — skipping auto-deploy. Add it under Settings → Secrets → Actions (create the hook in Render → axis-api → Settings → Deploy Hook)."
            exit 0
          fi
          code=$(curl -sS -X POST -o /dev/null -w "%{http_code}" "$RENDER_DEPLOY_HOOK_URL")
          echo "Render deploy hook → HTTP $code"
          test "$code" = "200"

  # G��G�� Deploy API to Render G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��
  # Render pulls the pre-built image from ghcr.io/lastmanupinc-hub/axis-api:latest
  # Configure Render service to use "Image" deploy with that URL.
  # No build minutes consumed G�� image is built by GitHub Actions above.

  # G��G�� Deploy Web to Cloudflare Pages G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��G��
  deploy-web:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5 # version comes from package.json "packageManager"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        env:
          # Same-site with the web origin so the HttpOnly axis_session cookie rides (H1 cutover).
          VITE_API_URL: https://api.iliad.trustfabric.ai
        run: pnpm -r build

      # THIS IS THE ONLY WAY THE WEB APP SHIPS. Verified against Cloudflare's
      # API 2026-07-27: the `axis-web` Pages project has `source: null` — no Git
      # connection exists, so the Git-connected build path described in
      # cloudflare-pages.md was never wired. Every live deployment is an
      # `ad_hoc` / `direct_upload`, i.e. this wrangler step.
      #
      # `continue-on-error: true` was removed deliberately. With it, a failed
      # deploy left CI green while the site silently stopped updating — the
      # worst combination, and especially bad for the sole deploy path. The
      # token is demonstrably healthy (6 consecutive successful deploys on
      # 2026-07-27), so the realistic failure modes now are an expired token or
      # a Cloudflare outage, both of which are things you want to be told
      # about. This job runs only on `main` and only after tests pass, so a red
      # run here means exactly one thing: the site did not update.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages deploy apps/web/dist --project-name=axis-web --commit-dirty=true

  # H8.11a — diff-scoped secret scan. Greps only the lines THIS push/PR adds
  # (never the whole repo state, so existing reviewed fixtures never need
  # retroactive allowlisting) for credential shapes: sk_live_, rk_live_,
  # whsec_, a Resend key, a HuggingFace token, a Render token. Gating by
  # design (unlike live-probe.mjs) — a real secret shape in an added line
  # fails the job. fetch-depth: 0 so any two SHAs in the diff range can
  # always be diffed regardless of how far back they are.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve diff range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after || github.sha }}"
            if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
              echo "range=HEAD^..HEAD" >> "$GITHUB_OUTPUT"
            else
              echo "range=$BEFORE..$AFTER" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Scan added lines for credential shapes
        run: node scripts/scan-diff-secrets.mjs "${{ steps.range.outputs.range }}"

  # H6.3 — live-probe battery: a repeatable version of the manual "July systems
  # check" (health/ready, MCP tools count, PAI'D config, anon 413 gate, web
  # bundle marker). Non-gating by design: axis-api's real deploy path is
  # Render's own independent Blueprint sync (not this workflow), so "just
  # pushed" doesn't mean "already live" on any fixed timeline this job could
  # wait for — this reports current production state, it never blocks a merge.
  # No dependencies (pure native fetch), so no pnpm install needed.
  live-probe:
    runs-on: ubuntu-latest
    needs: deploy-web
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      # No pnpm/action-setup here — live-probe.mjs is pure native fetch and
      # never shells out to pnpm (unlike determine-affected's job above,
      # which genuinely needs the pnpm CLI). package-manager-cache: false
      # keeps actions/setup-node@v7 from auto-enabling pnpm caching off the
      # "packageManager" field in package.json — see determine-affected's
      # comment (2026-07-31) for the root cause this avoids.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run live-probe battery
        run: node scripts/live-probe.mjs
