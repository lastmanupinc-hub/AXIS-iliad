name: Reusable test suite

# Shared build+test+lint body called by both ci.yml (affected-scoped, on every
# push/PR) and nightly.yml (always full, on a schedule). Kept in ONE place so
# the two callers can never drift apart the way the REST/MCP handler twins in
# this codebase have — see scripts/ci-affected.mjs's docblock for the affected-
# vs-full design this exists to serve.
on:
  workflow_call:
    inputs:
      full:
        description: "Run the full suite (coverage, Node 20+22 matrix) instead of an affected-only subset"
        type: boolean
        default: true
      packages:
        description: "Space-separated package directories passed to vitest (empty + full=false means nothing changed — tests are skipped, not widened)"
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Affected-only runs check the one Node version the API actually
        # deploys on; the nightly/full run keeps the real Node 20+22 matrix.
        node-version: ${{ inputs.full && fromJson('[20,22]') || fromJson('[22]') }}

    # Phase 6 of the Neon migration: the suite runs against a real Postgres
    # (the data layer is async pg; tests provision/truncate via resetTestDb).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Full history: some suites shell out to git against real history (the
      # secret-scan tooling diffs ranges, and repo-introspection tests read
      # commits), and a shallow clone makes those fail in ways that look like
      # product bugs rather than checkout config.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5 # version comes from package.json "packageManager"

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Build (always full)
        # Full, even on a narrow run. A filtered build compiles only the
        # changed packages, but `tsc` in a dependent package resolves its
        # workspace imports through the DEPENDENCY's emitted dist/*.d.ts — so
        # narrowing the build left @axis/snapshots unbuilt and every consumer
        # failed typecheck with "Cannot find module '@axis/snapshots'". The
        # savings were never here anyway: the Postgres-backed vitest suite
        # dominates this job's wall-clock, and that is what the affected
        # scoping below actually narrows.
        run: pnpm -r build

      - name: Install D2 (architecture diagram renderer)
        # canvas-diagram-watcher.test.ts's real-binary tests skip themselves
        # (it.skipIf(!d2Available)) when d2 isn't on PATH — install it here so
        # CI actually exercises the real renderer instead of silently skipping.
        run: curl -fsSL https://d2lang.com/install.sh | sudo sh -s -- --prefix /usr/local

      - name: Run tests (${{ inputs.full && 'full + coverage' || 'affected-only' }})
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/axis_test
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            npx vitest run --coverage --coverage.provider=v8 --coverage.reporter=text --coverage.reporter=json-summary --coverage.reportDir=coverage
          elif [ -n "${{ inputs.packages }}" ]; then
            npx vitest run ${{ inputs.packages }}
          else
            echo "No affected packages changed — skipping test run."
          fi

      - name: Type-check (always full)
        # `pnpm --filter "...[ref]" -r exec tsc --noEmit` looked like the same
        # pattern as the Build step above, but exec's binary resolution
        # doesn't compose reliably with the git-ref filter form the way a
        # package.json "build": "tsc" script does — the first real narrow run
        # caught it live: tsc fell through to a stray global copy and printed
        # its own help text instead of type-checking anything. Typecheck was
        # never the slow part (the Postgres-backed vitest suite is), and
        # cross-package type errors need full-project context to catch
        # reliably anyway — same reasoning as Lint below, just discovered the
        # hard way instead of up front.
        run: pnpm -r exec tsc --noEmit

      - name: Lint
        # Whole-repo, every run: type-aware ESLint rules need full project
        # context to be accurate, and lint itself is cheap next to the
        # Postgres-backed suite — narrowing it isn't worth the risk of a
        # scoped run missing a cross-file issue.
        run: pnpm lint

      - name: Artifact freshness gate
        run: npx tsx scripts/check-artifact-freshness.ts

      - name: Upload coverage report
        if: inputs.full && matrix.node-version == 22
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
