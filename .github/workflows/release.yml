name: release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: write       # create the release
  id-token: write       # npm/PyPI OIDC + Sigstore
  packages: write       # push to ghcr.io
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }   # full history so make ship can fingerprint commits
      - uses: pnpm/action-setup@v5
        with: { run_install: false }
      # setup-node@v5 auto-enables package-manager caching off package.json's
      # "packageManager" field. That is SAFE here (and not in determine-affected,
      # where it hard-failed the Post step) because this job runs
      # `pnpm install` immediately below, so the store the Post step saves is
      # actually populated. See ci.yml's determine-affected comment.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build --if-present
      - name: Run ship pipeline
        run: make ship
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Verify attestation bundle
        run: |
          test -f packaging/trust-fabric/attestation.json
          test -f packaging/trust-fabric/merkle-proof.json
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "axis-iliad ${{ github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            packaging/trust-fabric/attestation.json
            packaging/trust-fabric/merkle-proof.json